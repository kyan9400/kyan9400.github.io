<style>html,body{margin:0;background:#060d1a;color:#eef5f0;font:16px system-ui,sans-serif}a{color:#6ee7b7}</style>
<script>
(function () {
  var langs = ["en", "ru", "ar"], pick = "en";
  var m = document.cookie.match(/(?:^|; )lang=(en|ru|ar)/);
  if (m) pick = m[1];
  else {
    var prefs = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < prefs.length; i++) {
      var l = String(prefs[i]).slice(0, 2).toLowerCase();
      if (langs.indexOf(l) !== -1) { pick = l; break; }
    }
  }
  location.replace("/" + pick + "/" + location.hash);
})();
</script>
